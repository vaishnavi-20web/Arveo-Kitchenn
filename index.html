    ? "http://localhost:5000/api"
    : "https://arveo-kitchenn-production.up.railway.app/api");

async function postJSON(endpoint, payload) {
  try {
    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* non-JSON response */ }
    if (!res.ok || !data || data.success === false) {
      const message = (data && data.message) || "Unable to process your request. Please try again.";
      throw new Error(message);
    }
    return data;
  } catch (err) {
    if (err.name === "TypeError" || err.message === "Failed to fetch") {
      throw new Error("Unable to connect to backend service. Please ensure the backend server is active.");
    }
    throw err;
  }
}

}

const wikiImgCache = new Map();

function useWikiImage(title) {
  const [src, setSrc] = useState(() => (title && wikiImgCache.has(title) ? wikiImgCache.get(title) : undefined));
  useEffect(() => {
    if (!title) return;
    if (wikiImgCache.has(title)) { setSrc(wikiImgCache.get(title)); return; }
    let cancelled = false;
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        const url = (data && data.thumbnail && data.thumbnail.source) || null;
        wikiImgCache.set(title, url);
        if (!cancelled) setSrc(url);
      })
      .catch(() => { wikiImgCache.set(title, null); if (!cancelled) setSrc(null); });
    return () => { cancelled = true; };
  }, [title]);
  return src;
}

function DishTile({ name, cat, wiki, emoji }) {
  const [failed, setFailed] = useState(false);
  const src = useWikiImage(wiki);
  if (src && !failed) {
    return (
      <div className="av-dish-tile av-dish-photo">
        <img src={src} alt={name} loading="lazy" onError={() => setFailed(true)} />
      </div>
    );
  }
  return (
    <div className="av-dish-tile">
      <span className="av-dish-emoji">{emoji || CATEGORY_ICON[cat] || "🍽️"}</span>
    </div>
  );
}

function MenuPage({ addToCart, updateQty, cart }) {
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState("All");
  const [filters, setFilters] = useState([]);
  const qtyOf = (id) => (cart.find((c) => c.id === id) || {}).qty || 0;

  const toggleFilter = (f) => setFilters((prev) => prev.includes(f) ? prev.filter((x) => x !== f) : [...prev, f]);

  const filtered = useMemo(() => {
    return MENU.filter((item) => {
      if (activeCat !== "All" && item.cat !== activeCat) return false;
      if (query && !item.name.toLowerCase().includes(query.toLowerCase())) return false;
      if (filters.includes("Veg") && !item.tags.includes("Veg")) return false;
      if (filters.includes("Non-Veg") && !item.tags.includes("Non-Veg")) return false;
      if (filters.includes("Popular") && !item.tags.includes("Popular")) return false;
      if (filters.includes("Under100") && item.price >= 100) return false;
      if (filters.includes("Under200") && item.price >= 200) return false;
      return true;
    });
  }, [query, activeCat, filters]);

  return (
    <section className="av-section av-ivory av-page-top">
      <SectionEyebrow>OUR MENU</SectionEyebrow>
      <h2 className="av-h2">Explore The Menu</h2>
      <Divider />

      <div className="av-menu-toolbar">
        <div className="av-search">
          <Search size={18} />
          <input placeholder="Search dishes..." value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
        <div className="av-filters">
          {[["Veg", "Veg"], ["Non-Veg", "Non-Veg"], ["Popular", "Popular"], ["Under100", "Under ₹100"], ["Under200", "Under ₹200"]].map(([key, label]) => (
            <button key={key} className={`av-filter-chip ${filters.includes(key) ? "active" : ""}`} onClick={() => toggleFilter(key)}>
              <Filter size={12} /> {label}
            </button>
          ))}
        </div>
      </div>

      <div className="av-cat-tabs">
        <button className={`av-cat-tab ${activeCat === "All" ? "active" : ""}`} onClick={() => setActiveCat("All")}>All</button>
        {CATEGORIES.map((c) => (
          <button key={c} className={`av-cat-tab ${activeCat === c ? "active" : ""}`} onClick={() => setActiveCat(c)}>{c}</button>
        ))}
      </div>

      <div className="av-grid-4">
        {filtered.map((item) => (
          <DishCard key={item.id} item={item} qty={qtyOf(item.id)}
            onAdd={() => addToCart(item)} onInc={() => updateQty(item.id, 1)} onDec={() => updateQty(item.id, -1)} />

      </div>
    </section>
  );
}

function OrderPage({ cart, clearCart }) {

  const [error, setError] = useState(null);
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);

  const submit = async (e) => {
    e.preventDefault();
    if (!form.name || !form.phone) return;
    setError(null);

        email: form.email || undefined,
        address: form.address || undefined,
        notes: form.notes || undefined,
        delivery_option: form.delivery,

        total_amount: total,
        order_items: cart.map((c) => ({ id: c.id, name: c.name, price: c.price, qty: c.qty })),

      const res = await postJSON("/orders", payload);
      setPlaced("AR" + String(res.id).padStart(5, "0"));

/* ---------------- QR Table Ordering ---------------- */

function QRPage({ showToast }) {
  const [table, setTable] = useState(null);
  const [sent, setSent] = useState(false);
  const [tableCart, setTableCart] = useState([]);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState(null);

  const scan = () => setTable(Math.floor(1 + Math.random() * 20));

  const addLocal = (item) => {
    setTableCart((prev) => {
      const found = prev.find((p) => p.id === item.id);
      if (found) return prev.map((p) => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
      return [...prev, { ...item, qty: 1 }];
    });
    showToast(`${item.name} added to order`);
  };

  const localQty = (id, delta) => setTableCart((prev) => prev.flatMap((p) => {
    if (p.id !== id) return [p];
    const nq = p.qty + delta;
    return nq <= 0 ? [] : [{ ...p, qty: nq }];
  }));

  const qtyOf = (id) => (tableCart.find((c) => c.id === id) || {}).qty || 0;

  const sendToKitchen = async () => {
    setError(null);
    setSending(true);
    try {
      // QR ordering intentionally has no login/contact form, so we send a
      // table-identified placeholder rather than collecting personal details.
      await postJSON("/orders", {
        customer_name: `Table ${table} (QR Order)`,
        phone: "0000000000",
        delivery_option: "QR Table Order",
        payment_method: "Cash at Restaurant",
        notes: `QR table order — Table ${table}`,
        total_amount: total,
        order_items: tableCart.map((c) => ({ id: c.id, name: c.name, price: c.price, qty: c.qty })),
      });
      setSent(true);
    } catch (err) {
      setError(err.message);
    } finally {
      setSending(false);
    }
  };

  if (!table) {
    return (
      <section className="av-section av-ivory av-page-top av-center-page">
        <div className="av-card av-qr-scan">
          <QrCode size={48} color="#0F3B2E" />
          <h3>Scan Table QR Code</h3>
          <p>No login needed — scan the QR code on your table to start ordering directly to the kitchen.</p>
          <button className="av-btn-gold" onClick={scan}>Simulate QR Scan</button>
        </div>
      </section>
    );
  }

  if (sent) {
    return (
      <section className="av-section av-ivory av-page-top">
        <div className="av-card av-confirm">
          <CheckCircle2 size={40} color="#0F3B2E" />
          <h3>Order Sent to Kitchen</h3>
          <p>Table <strong>{table}</strong>'s order has been sent directly to the kitchen. Your food is on the way!</p>
        </div>
      </section>
    );
  }

  const total = tableCart.reduce((s, c) => s + c.price * c.qty, 0);

  return (
    <section className="av-section av-ivory av-page-top">
      <div className="av-table-banner"><QrCode size={18} /> Ordering for Table {table}</div>
      <h2 className="av-h2">Table Menu</h2>
      <Divider />
      <div className="av-grid-4">
        {MENU.slice(0, 8).map((item) => (
          <DishCard key={item.id} item={item} compact qty={qtyOf(item.id)}
            onAdd={() => addLocal(item)} onInc={() => localQty(item.id, 1)} onDec={() => localQty(item.id, -1)} />
        ))}
      </div>
      {tableCart.length > 0 && (
        <div className="av-card av-order-summary" style={{ marginTop: "2rem" }}>
          <h4>Table {table} Order</h4>
          {tableCart.map((c) => <div className="av-summary-row" key={c.id}><span>{c.name} × {c.qty}</span><span>₹{c.price * c.qty}</span></div>)}
          <div className="av-cart-total"><span>Total</span><strong>₹{total}</strong></div>
          {error && <p className="av-error-msg">{error}</p>}
          <button className="av-btn-gold av-full" onClick={sendToKitchen} disabled={sending}>{sending ? "Sending..." : "Send Order to Kitchen"}</button>
        </div>
      )}
    </section>
  );
}

  const [form, setForm] = useState({ function: "Birthday", date: "", time: "", hall: "Small Hall", package: "Classic Veg", guests: "" });
  const [done, setDone] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    if (!(form.date && form.guests)) return;
    setError(null);
    setLoading(true);
    try {
      await postJSON("/function-booking", {
        function_type: form.function,
        hall_name: form.hall,
        food_package: form.package,
        guest_count: Number(form.guests),
        booking_date: form.date,
        booking_time: form.time || undefined,
      });
      setDone(true);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  if (done) {
    return (
      <section className="av-section av-ivory av-page-top">
        <div className="av-card av-confirm">
          <CheckCircle2 size={40} color="#0F3B2E" />
          <h3>Function Food Pre-booked!</h3>
          <p>{form.package} package for {form.guests} guests confirmed on {form.date}.</p>
        </div>
      </section>
    );
  }

  return (
    <section className="av-section av-ivory av-page-top av-center-page">
      <SectionEyebrow>PLAN YOUR EVENT</SectionEyebrow>
      <h2 className="av-h2">Function Food Pre-booking</h2>
      <Divider />
      <form className="av-card av-form av-narrow" onSubmit={submit}>
        <label>Function Type
          <select value={form.function} onChange={(e) => setForm({ ...form, function: e.target.value })}>
            {["Birthday", "Wedding", "Anniversary", "Baby Shower", "Reception", "Corporate Event", "Meeting", "Family Gathering"].map((f) => <option key={f}>{f}</option>)}
          </select>
        </label>
        <div className="av-form-row">
          <label>Date<input required type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></label>
          <label>Time<input type="time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} /></label>
        </div>
        <label>Hall
          <select value={form.hall} onChange={(e) => setForm({ ...form, hall: e.target.value })}>
            {HALLS.map((h) => <option key={h.id}>{h.name}</option>)}
          </select>
        </label>
        <label>Food Package
          <select value={form.package} onChange={(e) => setForm({ ...form, package: e.target.value })}>
            <option>Classic Veg</option><option>Classic Non-Veg</option><option>Premium Veg</option><option>Premium Non-Veg</option>
          </select>
        </label>
        <label>Guest Count<input required type="number" value={form.guests} onChange={(e) => setForm({ ...form, guests: e.target.value })} /></label>
        {error && <p className="av-error-msg">{error}</p>}
        <button className="av-btn-gold av-full" type="submit" disabled={loading}>{loading ? "Booking..." : "Pre-book Food"}</button>
      </form>
    </section>
  );
}

/* ---------------- Cake Booking ---------------- */

function CakeBookingPage() {
  const [cat, setCat] = useState("Chocolate");
  const [weight, setWeight] = useState(1);
  const [message, setMessage] = useState("");
  const [fileName, setFileName] = useState("");
  const [withHall, setWithHall] = useState(false);
  const [deliveryTime, setDeliveryTime] = useState("");
  const [done, setDone] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const mult = CAKE_WEIGHTS.find((w) => w.kg === weight).mult;
  const price = Math.round(CAKE_BASE_PRICE[cat] * mult);

  const bookCake = async () => {
    setError(null);
    setLoading(true);
    try {
      await postJSON("/cake-booking", {
        cake_type: cat,
        weight,
        message: message || undefined,
        reference_image: fileName || undefined,
        delivery_time: deliveryTime || undefined,
        with_hall_booking: withHall,
        price,
      });
      setDone(true);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <section className="av-section av-ivory av-page-top">
      <SectionEyebrow>SWEETEN THE MOMENT</SectionEyebrow>
      <h2 className="av-h2">Cake Booking</h2>
      <Divider />
      {done ? (
        <div className="av-card av-confirm">
          <CheckCircle2 size={40} color="#0F3B2E" />
          <h3>Cake Booked!</h3>
          <p>{weight}kg {cat} cake will be delivered {withHall ? "along with your hall booking" : "separately"}{deliveryTime ? ` at ${deliveryTime}` : ""}.</p>
        </div>
      ) : (
        <>
          <div className="av-cake-grid">
            {CAKE_CATEGORIES.map((c) => (
              <button key={c} className={`av-cake-chip ${cat === c ? "active" : ""}`} onClick={() => setCat(c)}>
                <CakeIcon size={16} /> {c}
              </button>
            ))}
          </div>
          <div className="av-card av-form" style={{ marginTop: "1.5rem" }}>
            <label>Weight
              <div className="av-weight-row">
                {CAKE_WEIGHTS.map((w) => (
                  <button type="button" key={w.kg} className={`av-filter-chip ${weight === w.kg ? "active" : ""}`} onClick={() => setWeight(w.kg)}>{w.kg} kg</button>
                ))}
              </div>
            </label>
            <label>Upload Reference Image (optional)
              <input type="file" onChange={(e) => setFileName(e.target.files[0]?.name || "")} />
              {fileName && <span className="av-note">Attached: {fileName}</span>}
            </label>
            <label>Cake Message<input value={message} onChange={(e) => setMessage(e.target.value)} placeholder="e.g. Happy Birthday Aarav!" /></label>
            <label>Delivery Time<input type="time" value={deliveryTime} onChange={(e) => setDeliveryTime(e.target.value)} /></label>
            <label className="av-radio"><input type="checkbox" checked={withHall} onChange={(e) => setWithHall(e.target.checked)} /> Book along with a Party Hall booking</label>
            <div className="av-cart-total"><span>Estimated Price</span><strong>₹{price}</strong></div>
            {error && <p className="av-error-msg">{error}</p>}
            <button className="av-btn-gold av-full" onClick={bookCake} disabled={loading}>{loading ? "Booking..." : "Book Cake"}</button>
          </div>
        </>
      )}
    </section>
  );
}

/* ---------------- Enquiry (separate section) ---------------- */

function EnquiryPage() {
  const [form, setForm] = useState({ name: "", phone: "", email: "", category: "General Enquiry", subject: "", description: "", priority: "Low", contact: "Phone" });
  const [ticket, setTicket] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    if (!(form.name && form.subject)) return;
    setError(null);
    setLoading(true);
    try {
      const res = await postJSON("/enquiry", {
        name: form.name,
        phone: form.phone || undefined,
        email: form.email || undefined,
        category: form.category,
        subject: form.subject,
        description: form.description || undefined,
        priority: form.priority,
        contact_method: form.contact,
      });
      setTicket("ENQ" + String(res.id).padStart(4, "0"));
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  if (ticket) {
    return (

          <h3>Submitted — Ticket {ticket}</h3>
          <p>We'll get back to you via {form.contact} shortly.</p>

      </section>
    );
  }

  return (
    <section className="av-section av-ivory av-page-top av-center-page">
      <SectionEyebrow>WE'RE LISTENING</SectionEyebrow>
      <h2 className="av-h2">Customer Enquiry</h2>
      <Divider />
      <form className="av-card av-form av-narrow" onSubmit={submit}>
        <label>Full Name<input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></label>

        <label>Email Address<input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></label>
        <label>Category
          <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
            {["General Enquiry", "Food Complaint", "Restaurant Service", "Website Issue", "Online Order Issue", "Payment Issue", "Party Hall Booking", "Cake Booking", "Other"].map((c) => <option key={c}>{c}</option>)}
          </select>
        </label>

/* ---------------- App ---------------- */

function App() {
  const [page, setPage] = useState("home");
  const [cart, setCart] = useState([]);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const showToast = (msg) => setToast(msg);

  const addToCart = (item) => {
    setCart((prev) => {
      const found = prev.find((p) => p.id === item.id);
      if (found) return prev.map((p) => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
      return [...prev, { ...item, qty: 1 }];
    });
    showToast(`${item.name} added to cart`);
  };
  const updateQty = (id, delta) => setCart((prev) => prev.flatMap((p) => {
    if (p.id !== id) return [p];
    const nq = p.qty + delta;
    return nq <= 0 ? [] : [{ ...p, qty: nq }];
  }));
  const removeItem = (id) => setCart((prev) => prev.filter((p) => p.id !== id));
  const clearCart = () => setCart([]);
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  const pages = {
    home: <Home setPage={setPage} addToCart={addToCart} updateQty={updateQty} cart={cart} />,
    about: <About />,
    menu: <MenuPage addToCart={addToCart} updateQty={updateQty} cart={cart} />,
    cart: <CartPage cart={cart} updateQty={updateQty} removeItem={removeItem} setPage={setPage} />,
    order: <OrderPage cart={cart} clearCart={clearCart} />,
    qr: <QRPage showToast={showToast} />,
    reservation: <ReservationPage />,
    partyhall: <PartyHallPage />,
    function: <FunctionPrebookPage />,
    cake: <CakeBookingPage />,
    gallery: <GalleryPage />,
    enquiry: <EnquiryPage />,
    feedback: <FeedbackPage />,
    contact: <ContactPage />,
  };

  return (
    <div className="av-root">
      <style>{`
